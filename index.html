<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171326">
  <title>Ollama MCP Agent</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 22px; display: grid; place-items: center; background: #f1eff7; font-family: system-ui, sans-serif; color: #211a2e; }
    .container { width: min(100%, 760px); padding: 24px; border-radius: 18px; background: #fff; box-shadow: 0 12px 40px #24113a14; }
    h1 { margin: 0 0 6px; font-size: 1.45rem; }
    .subtitle { margin: 0 0 20px; color: #716a7d; font-size: .92rem; }
    textarea { display: block; width: 100%; min-height: 110px; resize: vertical; padding: 14px; border: 1px solid #c9b5dc; border-radius: 12px; font: inherit; outline: none; }
    textarea:focus { border-color: #872cc8; box-shadow: 0 0 0 3px #872cc81c; }
    button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 11px; background: #872cc8; color: white; font-size: 1rem; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 22px; margin: 12px 2px; color: #766b83; font-size: .82rem; }

    .output-card { min-height: 110px; padding: 16px; border: 1px solid #e5e0eb; border-left: 4px solid #872cc8; border-radius: 10px; overflow-wrap: anywhere; }
    .markdown-body { background: transparent; font-size: 15px; }
    @media (max-width: 520px) { body { padding: 12px; } .container { padding: 17px; } }
  </style>
</head>
<body>
  <main class="container">
    <h1>Ollama MCP Agent</h1>
    <p class="subtitle">Local Ollama model · Custom tools · Microsoft Learn MCP</p>
    <form id="chatForm">
      <textarea id="prompt" placeholder="Ask a question… (Ctrl + Enter to send)" required></textarea>
      <button id="sendBtn" type="submit">Send message</button>
    </form>
    <div id="status" role="status">Checking backend…</div>
    <section class="output-card markdown-body" aria-live="polite">
      <div id="output">Your AI response will appear here.</div>
    </section>
  </main>
  <script type="module" src="./frontend.js"></script>
</body>
</html>
